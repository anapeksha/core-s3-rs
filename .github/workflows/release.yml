name: Firmware release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
      - name: Install flashing tooling
        run: cargo install cargo-embed --locked
      - name: Build release firmware
        run: |
          cargo +esp build -p hello_world --release --target xtensa-esp32s3-none-elf
          cargo +esp build -p dirty_regions --release --target xtensa-esp32s3-none-elf
          cargo +esp build -p gateway_h2 --release --features gateway-h2 --target xtensa-esp32s3-none-elf
          mkdir -p target/firmware
          cp target/xtensa-esp32s3-none-elf/release/hello_world target/firmware/core-s3-hello_world.elf
          cp target/xtensa-esp32s3-none-elf/release/dirty_regions target/firmware/core-s3-dirty_regions.elf
          cp target/xtensa-esp32s3-none-elf/release/gateway_h2 target/firmware/core-s3-gateway_h2.elf
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-s3-firmware
          path: target/firmware/*
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: target/firmware/*
          generate_release_notes: true

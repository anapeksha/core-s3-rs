[package]
name = "core-s3"
version = "0.5.6"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
description = "Board support crate for the M5Stack CoreS3 ESP32-S3 kit."
keywords.workspace = true
categories.workspace = true

[features]
default = []
camera = ["esp-hal"]
defmt = ["dep:defmt", "heapless/defmt"]
esp-hal = ["dep:critical-section", "dep:embedded-hal-bus", "dep:esp-hal"]
rtos = [
    "esp-hal",
    "dep:embassy-executor",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:esp-rtos",
    "dep:static_cell",
    "esp-rtos/embassy",
    "esp-rtos/esp-alloc",
]
radio-coexistence = [
    "rtos",
    "dep:esp-radio",
    "esp-rtos/esp-radio",
    "esp-radio/wifi",
    "esp-radio/ble",
    "esp-radio/coex",
    "esp-radio/unstable",
]
sdmmc = ["dep:embedded-sdmmc"]
gateway-h2 = [
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embedded-io",
    "dep:embedded-io-async",
]

[dependencies]
critical-section = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embedded-graphics.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-hal-bus = { workspace = true, optional = true }
embedded-io = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
embedded-sdmmc = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
heapless.workspace = true
static_cell = { workspace = true, optional = true }


[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { workspace = true, optional = true }
esp-radio = { workspace = true, optional = true }
esp-rtos = { workspace = true, optional = true }

[lints]
workspace = true

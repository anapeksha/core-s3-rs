[package]
name = "core-s3"
version = "0.5.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
description = "Board support crate for the M5Stack CoreS3 ESP32-S3 kit."
keywords.workspace = true
categories.workspace = true

[features]
default = []
camera = ["esp-hal"]
defmt = ["dep:defmt", "heapless/defmt"]
esp-hal = ["dep:critical-section", "dep:embedded-hal-bus", "dep:esp-hal"]
sdmmc = ["dep:embedded-sdmmc"]
gateway-h2 = [
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embedded-io",
    "dep:embedded-io-async",
]

[dependencies]
critical-section = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embedded-graphics.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-hal-bus = { workspace = true, optional = true }
embedded-io = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
embedded-sdmmc = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
heapless.workspace = true


[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { workspace = true, optional = true }

[lints]
workspace = true
